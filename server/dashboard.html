function orderMatches(o, q) {
  if (!q) return true;
  if ((o.orderId || '').toLowerCase().includes(q)) return true;
  if ((o.status || '').toLowerCase().includes(q)) return true;
  for (const it of o.items) {
    if ((it.name || '').toLowerCase().includes(q)) return true;
    if ((it.brand || '').toLowerCase().includes(q)) return true;
    if ((it.asin || '').toLowerCase().includes(q)) return true;
  }
  return false;
}

function renderItemRow(it, order) {
  const row = el('div', 'item-row');
  row.appendChild(makeThumb(it));

  const mid = el('div');
  const nameDiv = el('div', 'item-name');
  const href = safeUrl(it.url);
  if (href) {
    const a = el('a', null, it.name || it.asin || '(unnamed item)');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    nameDiv.appendChild(a);
  } else {
    nameDiv.textContent = it.name || it.asin || '(unnamed item)';
  }
  mid.appendChild(nameDiv);
  const subParts = [];
  if (it.brand) subParts.push(it.brand);
  if (it.asin) subParts.push(it.asin);
  if (it.rating) subParts.push('★ ' + it.rating);
  if (subParts.length) mid.appendChild(el('div', 'item-sub', subParts.join(' · ')));
  row.appendChild(mid);

  const right = el('div', 'item-right');
  if (it.price) right.appendChild(el('span', 'price', it.price));
  // v1.6.0: repeat-purchase flag (SPEC §16.5) — muted badge when N>1.
  if ((Number(it.repeatCount) || 0) > 1) right.appendChild(el('span', 'badge repeat', 'REPEAT ×' + Number(it.repeatCount)));
  const overdue = overdueBadge(it, order);
  if (overdue) right.appendChild(overdue);
  // v1.8.0 (§21.1): posted review confirmed missing on Amazon.
  if (it.reviewMissing) right.appendChild(missingBadge(it));
  const badge = itemBadge(it);
  right.appendChild(el('span', 'badge ' + badge.cls, badge.label));
  if (it.posted && it.asin) {
    const un = el('button', 'linkbtn', 'Mark not posted');
    un.type = 'button';
    un.addEventListener('click', () => markPosted(it.asin, false));
    right.appendChild(un);
  }
  row.appendChild(right);
  return row;
}

function renderOrders(root) {
  const q = state.query.trim().toLowerCase();
  // Search-only filtering (v2.0.1): a card survives when any of its items
  // matches the query.
  const orders = state.data.orders.filter(o => orderMatches(o, q));

  if (state.data.orders.length === 0) {
    root.appendChild(el('p', 'empty',
      'No orders synced yet. Open your Amazon order history in Chrome and run the extension to sync.'));
    return;
  }
  if (orders.length === 0) {
    root.appendChild(el('p', 'empty', 'No orders match your search.'));
    return;
  }

  // Group by year, then month (newest first).
  const byYear = new Map();
  for (const o of orders) {
    const d = parseOrderDate(o.date);
    const year = d ? String(d.getFullYear()) : 'Unknown';
    const monthNum = d ? d.getMonth() + 1 : 0;
    const monthName = d ? d.toLocaleString('en-US', { month: 'long' }) : 'Unknown date';
    if (!byYear.has(year)) byYear.set(year, new Map());
    const byMonth = byYear.get(year);
    if (!byMonth.has(monthNum)) byMonth.set(monthNum, { name: monthName, orders: [] });
    byMonth.get(monthNum).orders.push(o);
  }
  const years = [...byYear.keys()].sort((a, b) =>
    a === 'Unknown' ? 1 : b === 'Unknown' ? -1 : Number(b) - Number(a));

  for (const year of years) {
    root.appendChild(el('div', 'year-h', year));
    const byMonth = byYear.get(year);
    const monthNums = [...byMonth.keys()].sort((a, b) => b - a);
    for (const mn of monthNums) {
      const bucket = byMonth.get(mn);
      const key = year + '-' + mn;
      const subtotal = bucket.orders.reduce((s, o) => s + parseCurrency(o.total), 0);
      const isCollapsed = state.collapsed.has(key);

      const head = el('button', 'month-head');
      head.type = 'button';
      head.appendChild(el('span', 'caret', isCollapsed ? '▸' : '▾'));
      head.appendChild(el('span', null, bucket.name + (year !== 'Unknown' ? ' ' + year : '')));
      head.appendChild(el('span', 'meta',
        bucket.orders.length + (bucket.orders.length === 1 ? ' order' : ' orders') +
        ' · ' + formatCurrency(subtotal)));
      root.appendChild(head);

      const body = el('div', 'month-body' + (isCollapsed ? ' collapsed' : ''));
      for (const o of bucket.orders) {
        body.appendChild(renderOrderCard(o));
      }
      root.appendChild(body);

      head.addEventListener('click', () => {
        if (state.collapsed.has(key)) state.collapsed.delete(key);
        else state.collapsed.add(key);
        renderAll();
      });
    }
  }
}

function renderOrderCard(o) {
  const card = el('div', 'order-card');

  const head = el('div', 'order-head');
  head.appendChild(el('span', 'mono', o.orderId || '(unknown order)'));
  if (o.date) head.appendChild(el('span', 'date', o.date));
  if (o.status) head.appendChild(el('span', 'pill ' + statusPillClass(o.status), o.status));
  if (o.shipTo) head.appendChild(el('span', 'shipto', 'Ship to: ' + o.shipTo));
  if (o.total) head.appendChild(el('span', 'total', o.total));
  card.appendChild(head);

  for (const it of o.items) {
    card.appendChild(renderItemRow(it, o));
  }
  return card;
}

// ---------------------------------------------------------------------------
// Needs Review tab
// ---------------------------------------------------------------------------

// v1.8.7 (§25.2): batch size for Needs Review pagination.
const REVIEW_BATCH = 50;

function renderReview(root) {
  const q = state.query.trim().toLowerCase();

  // v1.8.0 (§21.1): amber one-liner while any posted review is confirmed
  // missing on Amazon (meta.missingReviews, confirmed sightings only).
  const missing = Array.isArray(state.data.missingReviews) ? state.data.missingReviews : [];
  if (missing.length > 0) {
    root.appendChild(el('div', 'missing-notice',
      missing.length + ' POSTED REVIEW(S) NOT FOUND ON AMAZON — YOUR TEXT IS SAFE IN THE NOTE; REPOST OR DISMISS'));
  }

  const rows = [];
  // v1.8.8 (§26.2): beyond-cutoff items are hidden by default. hiddenOlder
  // counts the older items that match the search filter — it feeds the
  // SHOW OLDER chip and stays stable whether the toggle is on or off.
  let hiddenOlder = 0;
  for (const o of state.data.orders) {
    for (const it of o.items) {
      // v1.8.0 (§21.1): a posted item flagged reviewMissing stays listed so
      // it can be reposted (text is safe in the note) or dismissed.
      if (it.posted && !it.reviewMissing) continue;
      if (q && !orderMatches(o, q)) continue;
      // v1.8.8 (§26.2): cutoff hiding composes with search and the
      // §25.2 batching (hidden items never enter `rows`, so they never count
      // as "remaining" in LOAD MORE math; with SHOW OLDER on they do).
      if (it.beyondCutoff) {
        hiddenOlder++;
        if (!state.showOlder) continue;
      }
      rows.push({ order: o, item: it });
    }
  }

  if (!state.data.geminiConfigured) {
    root.appendChild(el('p', 'hint',
      'No Gemini API key is configured, so AI review drafts are not generated automatically. ' +
      'You can still write reviews by hand in the order notes.'));
  }

  // Chip row: SHOW OLDER cutoff toggle (below) plus the select-all control.
  const chips = el('div', 'chipbar');

  // v1.8.8 (§26.2): quiet SHOW OLDER chip — visible
  // only while older items exist under the current search; toggles revealing
  // them (active state while on). Never persisted; load() resets it to off.
  if (hiddenOlder > 0) {
    const cutoffDays = Number(state.data.reviewCutoffDays) || 60;
    const olderChip = el('button', 'chip' + (state.showOlder ? ' active' : ''),
      'Show older (' + hiddenOlder + ')');
    olderChip.type = 'button';
    olderChip.id = 'showOlderChip';
    olderChip.title = (state.showOlder ? 'Hide' : 'Reveal') +
      ' items from orders older than ' + cutoffDays + ' days';
    olderChip.addEventListener('click', () => {
      state.showOlder = !state.showOlder;
      renderAll();
    });
    chips.appendChild(olderChip);
  }

  const unposted = [];
  for (const o of state.data.orders) {
    // v1.8.0 (§21.1): flagged reviewMissing items count as waiting too.
    for (const it of o.items) if (!it.posted || it.reviewMissing) unposted.push(it);
  }
  if (unposted.length === 0) {
    root.appendChild(chips);
    root.appendChild(el('p', 'empty', 'Nothing waiting for a review. Nice.'));
    return;
  }

  // Select-all/none control (right end of the chip row). Re-rendered with
  // the panel; toggles EVERY MATCHING item — rendered or not (v1.8.7 §25.2:
  // selection is fully data-driven) — without touching unsaved textarea
  // edits (rendered checkboxes are synced in place).
  const visibleAsins = rows.map(r => r.item.asin).filter(Boolean);
  const slot = el('div');
  const selAll = el('button', 'linkbtn');
  selAll.type = 'button';
  selAll.style.marginLeft = 'auto';
  const paintSelAll = () => {
    const allOn = visibleAsins.length > 0 && visibleAsins.every(a => state.selected.has(a));
    selAll.textContent = allOn ? 'Select none' : 'Select all';
  };
  paintSelAll();
  selAll.addEventListener('click', () => {
    const allOn = visibleAsins.length > 0 && visibleAsins.every(a => state.selected.has(a));
    for (const a of visibleAsins) {
      if (allOn) state.selected.delete(a); else state.selected.add(a);
    }
    paintSelAll();
    syncSelectionUI(slot);
  });
  chips.appendChild(selAll);
  root.appendChild(chips);

  if (rows.length === 0) {
    root.appendChild(el('p', 'empty', hiddenOlder > 0
      ? 'Nothing within the review cutoff matches — SHOW OLDER reveals ' +
        hiddenOlder + ' older item' + (hiddenOlder === 1 ? '' : 's') + '.'
      : 'No items match your search.'));
    return;
  }

  // Sticky bulk bar lives in this slot; it is re-rendered in place on
  // selection changes so in-progress card edits survive.
  renderBulkBar(slot);
  root.appendChild(slot);

  // v1.8.7 (§25.2): paginate the list in batches of REVIEW_BATCH. The first
  // batch renders here; LOAD MORE appends the next batch in place (nodes are
  // inserted before the button — already-rendered cards are never rebuilt,
  // so unsaved Review Studio edits in them survive). state.reviewLimit is
  // reset to REVIEW_BATCH by renderAll on every tab/search/load change;
  // unrendering a card never touches state.selected.
  const moreBtn = el('button', 'loadmore');
  moreBtn.type = 'button';
  let rendered = 0;
  const paintMore = () => {
    moreBtn.textContent = 'LOAD MORE (' + (rows.length - rendered) + ' REMAINING)';
  };
  const renderBatch = () => {
    const next = Math.min(rendered + REVIEW_BATCH, rows.length);
    for (let i = rendered; i < next; i++) {
      root.insertBefore(renderReviewCard(rows[i].order, rows[i].item, slot), moreBtn);
    }
    rendered = next;
    state.reviewLimit = rendered;
    if (rendered >= rows.length) moreBtn.remove();
    else paintMore();
  };
  moreBtn.addEventListener('click', renderBatch);
  root.appendChild(moreBtn);
  renderBatch(); // first batch; removes the button when nothing remains
}

// Sync checkboxes + bulk bar after select-all/none (no full re-render).
function syncSelectionUI(slot) {
  for (const cb of document.querySelectorAll('#panel-review .selbox')) {
    if (cb.dataset.asin) cb.checked = state.selected.has(cb.dataset.asin);
  }
  renderBulkBar(slot);
}

// v1.3.0: sticky bulk bar — visible while >=1 item is selected. Actions loop
// the existing per-item endpoints sequentially with live progress, refresh
// once at the end, and collect failures into a summary notice.
function renderBulkBar(slot) {
  slot.textContent = '';
  const n = state.selected.size;
  if (n === 0) return;

  const bar = el('div', 'bulk-bar');
  const markBtn = el('button', 'btn', 'Mark posted (' + n + ')');
  markBtn.type = 'button';

  const ratingSel = el('select');
  ratingSel.setAttribute('aria-label', 'Bulk rating');
  const keep = el('option', null, 'Keep each');
  keep.value = '';
  ratingSel.appendChild(keep);
  for (let i = 1; i <= 5; i++) {
    const o = el('option', null, String(i) + (i === 1 ? ' star' : ' stars'));
    o.value = String(i);
    ratingSel.appendChild(o);
  }

  const toneSel = makeToneSelect({ kind: 'bulk' });

  const regenBtn = el('button', 'btn', 'Regenerate (' + n + ')');
  regenBtn.type = 'button';
  const clearBtn = el('button', 'linkbtn', 'Clear');
  clearBtn.type = 'button';
  const progress = el('span', 'bulk-progress');

  const setBusy = (busy) => {
    markBtn.disabled = busy;
    regenBtn.disabled = busy;
    clearBtn.disabled = busy;
    ratingSel.disabled = busy;
    toneSel.disabled = busy;
  };

  const runBulk = async (kind) => {
    const asins = [...state.selected];
    const ratingOverride = clampRating(ratingSel.value);
    const tone = toneSel.value;
    setBusy(true);
    const failures = [];
    let done = 0;
    for (const asin of asins) {
      progress.textContent = done + '/' + asins.length + '…';
      try {
        if (kind === 'mark') {
          await markPostedRaw(asin, true);
        } else {
          const rating = ratingOverride ||
            clampRating((findItemByAsin(asin) || {}).rating) || 5;
          await regenerateReview(asin, rating, tone);
        }
        delete state.edits[asin]; // v1.7.2 (§20.6): success — drop the unsaved edit
      } catch (e) {
        failures.push(asin + ' (' + e.message + ')');
      }
      done++;
      progress.textContent = done + '/' + asins.length;
    }
    setBusy(false);
    await load(); // single refresh at the end; also clears the selection
    if (failures.length) {
      showNotice('Bulk ' + (kind === 'mark' ? 'mark-posted' : 'regenerate') +
        ': ' + (asins.length - failures.length) + '/' + asins.length +
        ' succeeded. Failed: ' + failures.join(', '));
    } else {
      showNotice(kind === 'mark'
        ? 'Marked ' + done + (done === 1 ? ' item' : ' items') + ' posted.'
        : 'Regenerated ' + done + (done === 1 ? ' draft' : ' drafts') + '.');
    }
  };

  markBtn.addEventListener('click', () => runBulk('mark'));
  regenBtn.addEventListener('click', () => runBulk('regen'));
  clearBtn.addEventListener('click', () => {
    state.selected.clear();
    for (const cb of document.querySelectorAll('#panel-review .selbox')) cb.checked = false;
    renderBulkBar(slot);
  });

  bar.appendChild(markBtn);
  bar.appendChild(ratingSel);
  bar.appendChild(toneSel);
  bar.appendChild(regenBtn);
  bar.appendChild(clearBtn);
  bar.appendChild(progress);
  slot.appendChild(bar);
}

// Review Studio card: editable title/body, star-rating picker, and
// save/regenerate actions alongside the existing copy/Amazon/mark-posted.
// All dynamic text goes through textContent / input .value (never innerHTML).
function renderReviewCard(order, item, bulkSlot) {
  const card = el('div', 'review-card selectable');

  // Leading selection checkbox (v1.3.0 bulk actions). Selection changes only
  // re-render the bulk bar so unsaved edits on other cards survive.
  const cb = el('input', 'selbox');
  cb.type = 'checkbox';
  cb.setAttribute('aria-label', 'Select for bulk actions');
  if (item.asin) {
    cb.dataset.asin = item.asin;
    cb.checked = state.selected.has(item.asin);
    cb.addEventListener('change', () => {
      if (cb.checked) state.selected.add(item.asin);
      else state.selected.delete(item.asin);
      if (bulkSlot) renderBulkBar(bulkSlot);
    });
  } else {
    cb.disabled = true;
    cb.title = 'No ASIN — bulk actions unavailable';
  }
  card.appendChild(cb);
  card.appendChild(makeThumb(item));

  const body = el('div');
  body.appendChild(el('div', 'item-name', item.name || item.asin || '(unnamed item)'));
  const where = el('div', 'where',
    'Order ' + (order.orderId || '?') + (order.date ? ' · ' + order.date : ''));
  // v1.6.0: repeat-purchase flag (SPEC §16.5) — muted badge when N>1.
  if ((Number(item.repeatCount) || 0) > 1) {
    where.appendChild(document.createTextNode(' '));
    where.appendChild(el('span', 'badge repeat', 'REPEAT ×' + Number(item.repeatCount)));
  }
  const overdue = overdueBadge(item, order);
  if (overdue) {
    where.appendChild(document.createTextNode(' '));
    where.appendChild(overdue);
  }
  // v1.8.0 (§21.1): posted review confirmed missing on Amazon.
  if (item.reviewMissing) {
    where.appendChild(document.createTextNode(' '));
    where.appendChild(missingBadge(item));
  }
  body.appendChild(where);

  const studio = el('div', 'studio');

  // v1.7.2 (§20.6): unsaved edits win over server data on every render.
  const edit = (item.asin && state.edits[item.asin]) || null;
  const recordEdit = () => {
    if (!item.asin) return;
    state.edits[item.asin] = { title: titleInput.value, text: textInput.value, rating };
  };

  studio.appendChild(el('label', 'field-label', 'Title'));
  const titleInput = el('input', 'title-input');
  titleInput.type = 'text';
  titleInput.value = edit ? edit.title : (item.reviewTitle || '');
  titleInput.placeholder = 'Review title';
  titleInput.addEventListener('input', recordEdit);
  studio.appendChild(titleInput);

  const bodyHead = el('div', 'field-row');
  bodyHead.appendChild(el('label', 'field-label', 'Review'));
  const counter = el('span', 'char-counter');
  bodyHead.appendChild(counter);
  studio.appendChild(bodyHead);

  const textInput = el('textarea', 'review-input');
  textInput.value = edit ? edit.text : (item.reviewText || '');
  textInput.placeholder = item.hasDraft
    ? ''
    : 'No draft yet — write one here, or press Regenerate to create one.';
  textInput.rows = 3;
  studio.appendChild(textInput);

  const updateCounter = () => {
    const n = textInput.value.length;
    counter.textContent = n + (n === 1 ? ' char' : ' chars');
  };
  updateCounter();
  textInput.addEventListener('input', () => { autoGrow(textInput); updateCounter(); recordEdit(); });

  // Star-rating picker (1–5); defaults to the draft's rating, else 5.
  // v1.7.2 (§20.6): an unsaved rating edit wins over the server value.
  let rating = (edit && clampRating(edit.rating)) || clampRating(item.rating) || 5;
  const ratingRow = el('div', 'field-row');
  ratingRow.appendChild(el('span', 'field-label', 'Rating'));
  const stars = el('div', 'stars');
  stars.setAttribute('role', 'radiogroup');
  stars.setAttribute('aria-label', 'Star rating');
  const starBtns = [];
  const paintStars = () => {
    for (let i = 0; i < starBtns.length; i++) {
      starBtns[i].classList.toggle('on', i < rating);
      starBtns[i].setAttribute('aria-checked', String(i + 1 === rating));
    }
  };
  for (let i = 1; i <= 5; i++) {
    const s = el('button', 'star', '★');
    s.type = 'button';
    s.title = i + (i === 1 ? ' star' : ' stars');
    s.setAttribute('role', 'radio');
    s.setAttribute('aria-label', s.title);
    const val = i;
    s.addEventListener('click', () => { rating = val; paintStars(); recordEdit(); });
    starBtns.push(s);
    stars.appendChild(s);
  }
  paintStars();
  ratingRow.appendChild(stars);
  studio.appendChild(ratingRow);

  // Inline status note for save/regenerate feedback.
  const status = el('span', 'studio-status');
  let statusTimer = null;
  const setStatus = (kind, msg, sticky) => {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    status.className = 'studio-status' + (kind ? ' ' + kind : '');
    status.textContent = msg || '';
    if (msg && !sticky) {
      statusTimer = setTimeout(() => { status.textContent = ''; }, 3000);
    }
  };

  const actions = el('div', 'actions');

  // SAVE DRAFT — persist the current input values to the order note.
  const saveBtn = el('button', 'btn', 'Save draft');
  saveBtn.type = 'button';
  if (!item.asin) saveBtn.disabled = true;
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    setStatus('', '');
    try {
      const data = await saveReview(item.asin, titleInput.value, textInput.value);
      item.reviewTitle = titleInput.value;
      item.reviewText = textInput.value;
      item.hasDraft = textInput.value.trim().length > 0;
      delete state.edits[item.asin]; // v1.7.2 (§20.6): saved — drop the edit
      setStatus('ok', 'Saved' + (data && data.item_name ? ' — ' + data.item_name : ''));
    } catch (e) {
      setStatus('err', 'Save failed (' + e.message + ')', true);
    } finally {
      saveBtn.disabled = false;
    }
  });
  actions.appendChild(saveBtn);

  // REGENERATE — new AI draft at the chosen rating; the card updates in
  // place. Disabled with a busy label while the request is in flight.
  const regenBtn = el('button', 'btn', 'Regenerate');
  regenBtn.type = 'button';
  if (!item.asin) regenBtn.disabled = true;
  // v1.3.0 per-card tone; v1.4.0: smart default = best-performing tone,
  // explicit user choice sticks for the session.
  const toneSel = makeToneSelect({ kind: 'card', key: item.asin || item.name || '' });
  regenBtn.addEventListener('click', async () => {
    regenBtn.disabled = true;
    regenBtn.textContent = 'Regenerating…';
    setStatus('', '');
    try {
      const data = await regenerateReview(item.asin, rating, toneSel.value);
      titleInput.value = data.title || '';
      textInput.value = data.text || '';
      autoGrow(textInput);
      updateCounter();
      const newRating = clampRating(data.rating);
      if (newRating) { rating = newRating; paintStars(); }
      item.reviewTitle = titleInput.value;
      item.reviewText = textInput.value;
      item.hasDraft = textInput.value.trim().length > 0;
      item.rating = rating;
      delete state.edits[item.asin]; // v1.7.2 (§20.6): regenerated — drop the edit
      if (data.fallback) {
        setStatus('warn', 'Fallback draft — Gemini unavailable', true);
      } else {
        setStatus('ok', 'Draft regenerated');
      }
    } catch (e) {
      setStatus('err', 'Regenerate failed (' + e.message + ')', true);
    } finally {
      regenBtn.disabled = false;
      regenBtn.textContent = 'Regenerate';
    }
  });
  actions.appendChild(regenBtn);
  actions.appendChild(toneSel);

  const copyBtn = el('button', 'btn', 'Copy review');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', () => copyReview(copyBtn, {
    reviewTitle: titleInput.value,
    reviewText: textInput.value
  }));
  actions.appendChild(copyBtn);

  if (item.asin) {
    const reviewLink = el('a', 'btn', 'Leave review on Amazon');
    reviewLink.href = 'https://www.amazon.com/review/create-review?asin=' +
      encodeURIComponent(item.asin);
    reviewLink.target = '_blank';
    reviewLink.rel = 'noopener noreferrer';
    actions.appendChild(reviewLink);

    const markBtn = el('button', 'btn primary', 'Mark posted');
    markBtn.type = 'button';
    markBtn.addEventListener('click', () => markPosted(item.asin, true));
    actions.appendChild(markBtn);
  }

  actions.appendChild(status);

  body.appendChild(studio);
  body.appendChild(actions);
  card.appendChild(body);

  // Grow the textarea to fit the restored draft once the card is in layout.
  requestAnimationFrame(() => autoGrow(textInput));

  return card;
}

// ---------------------------------------------------------------------------
// SYNC tab (v1.7.0, SPEC §18.6)
// ---------------------------------------------------------------------------

// Form state: initialized once from headless.lastOptions (the last effective
// options), else full defaults; user edits stick for the session.
function currentSyncForm() {
  if (!state.syncFormInit) {
    state.syncFormInit = true;
    const h = headlessMeta();
    const lo = h && h.lastOptions && typeof h.lastOptions === 'object' ? h.lastOptions : null;
    const r = lo && lo.refresh && typeof lo.refresh === 'object' ? lo.refresh : {};
    state.syncForm = {
      mode: lo && (lo.mode === 'quick' || lo.mode === 'catchup') ? lo.mode : 'full',
      maxOrders: lo && Number.isInteger(lo.maxOrders) && lo.maxOrders > 0 ? lo.maxOrders : 0,
      timeBudgetSec: lo && Number.isInteger(lo.timeBudgetSec) && lo.timeBudgetSec > 0 ? lo.timeBudgetSec : 0,
      refresh: {
        prices: r.prices !== false,
        votes: r.votes !== false,
        details: r.details !== false
      }
    };
  }
  return state.syncForm;
}

function logTimeLabel(t) {
  const d = new Date(Number(t) || Date.now());
  return isNaN(d.getTime()) ? '--:--:--' : d.toLocaleTimeString('en-GB', { hour12: false });
}

function renderLogLine(l) {
  const row = el('div', 'logline');
  row.appendChild(el('span', 'lt', logTimeLabel(l && l.t)));
  row.appendChild(document.createTextNode(String(l && l.text != null ? l.text : '')));
  return row;
}

// Append to the persistent buffer and, when the SYNC tab's log box is in the
// DOM, to the view (auto-scroll only while pinned to the bottom).
function appendLogLines(lines) {
  if (!Array.isArray(lines) || !lines.length) return;
  state.logLines.push(...lines);
  if (state.logLines.length > 2000) state.logLines = state.logLines.slice(-2000);
  const box = document.getElementById('logBox');
  if (box) {
    // v1.8.8 (§26.3): real lines replace the "Waiting…" placeholder so the
    // view (and COPY) only ever holds log text.
    const ph = box.querySelector('.logplaceholder');
    if (ph) ph.remove();
    for (const l of lines) box.appendChild(renderLogLine(l));
    while (box.childNodes.length > 2000) box.removeChild(box.firstChild);
    if (state.logPinned) box.scrollTop = box.scrollHeight;
  }
}

// Log poller: the ONLY new polling in v1.7.0 — runs every 2s and only while
// the SYNC tab is the visible tab AND the document is visible.
// v1.7.2 (§20.6): single chain via a generation counter. Every start/stop
// bumps state.logPollGen; a tick captures its generation and reschedules
// only while that generation still matches, so renderAll/pause/visibility
// races can never spawn a second chain. scheduleLogPoll is the ONLY
// scheduling site.
function scheduleLogPoll(gen, delay) {
  if (gen !== state.logPollGen) return; // superseded chain — let it die
  if (state.tab !== 'sync' || document.hidden) return;
  if (state.logTimer) clearTimeout(state.logTimer);
  state.logTimer = setTimeout(() => {
    state.logTimer = null;
    logPollTick(gen);
  }, delay);
}

async function logPollTick(gen) {
  if (gen !== state.logPollGen) return; // a start/stop happened — die
  if (state.tab !== 'sync' || document.hidden) return;
  // A fetch from a superseded chain may still be in flight (start/stop races
  // can't cancel it); defer rather than overlap so at most ONE /api/logs
  // request is ever outstanding.
  if (!state.logPaused && !state.logPollBusy) {
    state.logPollBusy = true;
    try {
      const url = state.logCursor == null ? '/api/logs' : '/api/logs?after=' + state.logCursor;
      const res = await fetch(url);
      if (res.ok) {
        const d = await res.json();
        appendLogLines(d && d.lines);
        if (d && Number.isInteger(d.next)) state.logCursor = d.next;
      }
      // v1.9.3: the GEMINI USAGE panel refreshes with the same cheap poll —
      // /api/orders is far too heavy for 2s polling at thousands of notes.
      try {
        const ures = await fetch('/api/gemini-usage');
        if (ures.ok) {
          const u = await ures.json();
          if (u && Number.isInteger(u.used) && Number.isInteger(u.limit) && u.limit > 0) {
            if (state.data) state.data.gemini = u;
            const numEl = document.getElementById('gemNum');
            const fillEl = document.getElementById('gemFill');
            const text = u.used + ' / ' + u.limit;
            if (numEl && numEl.textContent !== text) numEl.textContent = text;
            if (fillEl) {
              const pct = Math.min(100, Math.max(0, (u.used / u.limit) * 100));
              fillEl.style.width = pct.toFixed(1) + '%';
              fillEl.classList.toggle('warn', pct >= 80);
            }
          }
        }
      } catch { /* usage endpoint unreachable — keep last known */ }
    } catch { /* daemon unreachable — retry next tick */ }
    state.logPollBusy = false;
  }
  scheduleLogPoll(gen, 2000);
}

function startLogPolling() {
  state.logPollGen++; // invalidate any chain already in flight
  scheduleLogPoll(state.logPollGen, 0);
}

function stopLogPolling() {
  state.logPollGen++; // invalidate any chain already in flight
  if (state.logTimer) {
    clearTimeout(state.logTimer);
    state.logTimer = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLogPolling();
  else if (state.tab === 'sync') startLogPolling();
});

function renderSync(root) {
  const hMeta = headlessMeta();
  const form = currentSyncForm();
  const runActive = state.syncNowBusy || !!(hMeta && hMeta.running);

  // --- GUIDANCE (§18.4): amber-bordered box when the last run errored. ---
  // v1.8.8 (§26.3): dismiss (×) control — per-session, like the stale banner.
  const g = hMeta && hMeta.guidance;
  if (g && g.message && !state.guidanceDismissed) {
    const box = el('div', 'guidance-box');
    box.id = 'guidanceBox';
    const gHead = el('div', 'g-head');
    gHead.appendChild(el('div', 'g-msg', String(g.message)));
    const gDismiss = el('button', 'g-dismiss', '×');
    gDismiss.type = 'button';
    gDismiss.id = 'guidanceDismiss';
    gDismiss.title = 'Dismiss for this session';
    gDismiss.setAttribute('aria-label', 'Dismiss guidance');
    gDismiss.addEventListener('click', () => {
      state.guidanceDismissed = true;
      box.remove();
    });
    gHead.appendChild(gDismiss);
    box.appendChild(gHead);
    if (Array.isArray(g.steps) && g.steps.length) {
      const ol = el('ol');
      for (const s of g.steps) ol.appendChild(el('li', null, String(s)));
      box.appendChild(ol);
    }
    root.appendChild(box);
  }

  // --- CONTROLS panel ---
  const ctl = el('div', 'panel');
  ctl.id = 'syncControls';
  ctl.appendChild(el('h2', null, 'Controls'));

  const modeRow = el('div', 'ctl-row');
  modeRow.appendChild(el('span', 'field-label', 'Mode'));
  for (const [val, label] of [['quick', 'Quick — skip completed'], ['catchup', 'Catch-up — only new orders'], ['full', 'Full']]) {
    const lab = el('label', 'radio-opt');
    const radio = el('input');
    radio.type = 'radio';
    radio.name = 'syncMode';
    radio.value = val;
    radio.checked = form.mode === val;
    radio.addEventListener('change', () => { form.mode = val; });
    lab.appendChild(radio);
    lab.appendChild(document.createTextNode(label));
    modeRow.appendChild(lab);
  }
  ctl.appendChild(modeRow);

  const numRow = el('div', 'ctl-row');
  const numField = (label, key, hint) => {
    const wrap = el('div', 'ctl-field');
    wrap.appendChild(el('span', 'field-label', label));
    const inp = el('input', 'num-input');
    inp.type = 'number';
    inp.min = '0';
    inp.step = '1';
    inp.value = String(form[key]);
    inp.title = hint;
    inp.id = 'sync-' + key;
    // v1.9.0: commit on EVERY keystroke, not just blur — a blur-only change
    // event is lost when a re-render lands between typing and clicking, which
    // made an edited 0 silently revert to the previous value at submit time.
    inp.addEventListener('input', () => {
      const n = parseInt(inp.value, 10);
      form[key] = (Number.isInteger(n) && n > 0) ? n : 0;
    });
    wrap.appendChild(inp);
    return wrap;
  };
  numRow.appendChild(numField('Max orders (0 = all)', 'maxOrders', '0 = all orders'));
  numRow.appendChild(numField('Time budget, sec (0 = none)', 'timeBudgetSec', '0 = no time budget'));
  ctl.appendChild(numRow);

  const refRow = el('div', 'ctl-row');
  refRow.appendChild(el('span', 'field-label', 'Refresh'));
  for (const [key, label] of [['prices', 'Prices'], ['votes', 'Review status + votes'], ['details', 'Details']]) {
    const lab = el('label', 'check-opt');
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = form.refresh[key];
    cb.id = 'sync-refresh-' + key;
    cb.addEventListener('change', () => { form.refresh[key] = cb.checked; });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(label));
    refRow.appendChild(lab);
  }
  ctl.appendChild(refRow);

  const actions = el('div', 'actions');
  if (runActive) {
    // §17.3 behavior, also on the SYNC tab: STOP SYNC while a run is active.
    const stopBtn = el('button', 'quiet-link danger', 'Stop sync');
    stopBtn.type = 'button';
    stopBtn.id = 'syncTabStopBtn';
    stopBtn.addEventListener('click', stopSync);
    actions.appendChild(stopBtn);
  } else {
    // v1.8.2 (§22.2): while the login-block gate is active, both triggers
    // are disabled with explaining titles and an amber hint replaces the
    // idle button row.
    const loginBlocked = !!(hMeta && hMeta.loginBlocked);
    const startBtn = el('button', 'btn primary', state.syncNowBusy ? 'Syncing…' : 'Start sync');
    startBtn.type = 'button';
    startBtn.id = 'startSyncBtn';
    startBtn.disabled = loginBlocked || state.syncNowBusy || state.reviewCheckBusy;
    if (loginBlocked) startBtn.title = 'Log in required — run SETUP LOGIN first';
    startBtn.addEventListener('click', () => {
      // v1.9.0 belt: re-read the live inputs at submit time, so even an
      // event-ordering oddity can never send a stale number.
      for (const key of ['maxOrders', 'timeBudgetSec']) {
        const live = document.getElementById('sync-' + key);
        if (live) {
          const n = parseInt(live.value, 10);
          form[key] = (Number.isInteger(n) && n > 0) ? n : 0;
        }
      }
      syncNow({
        mode: form.mode,
        maxOrders: form.maxOrders,
        timeBudgetSec: form.timeBudgetSec,
        refresh: {
          prices: form.refresh.prices,
          votes: form.refresh.votes,
          details: form.refresh.details
        }
      });
    });
    actions.appendChild(startBtn);

    const rcBtn = el('button', 'btn', state.reviewCheckBusy ? 'Checking…' : 'Review check now');
    rcBtn.type = 'button';
    rcBtn.id = 'reviewCheckBtn';
    rcBtn.disabled = loginBlocked || state.reviewCheckBusy || state.syncNowBusy;
    if (loginBlocked) rcBtn.title = 'Log in required — run SETUP LOGIN first';
    rcBtn.addEventListener('click', reviewCheckNow);
    actions.appendChild(rcBtn);

    if (loginBlocked) {
      const hint = el('span', 'login-block-hint', 'LOG IN REQUIRED — RUN SETUP LOGIN FIRST');
      hint.id = 'loginBlockHint';
      actions.appendChild(hint);
    }
  }
  ctl.appendChild(actions);
  root.appendChild(ctl);

  // --- RUN STATUS + HISTORY panel ---
  const stPanel = el('div', 'panel');
  stPanel.id = 'runStatusPanel';
  stPanel.appendChild(el('h2', null, 'HEADLESS RUN STATUS')); // v1.7.2 (§20.6)
  const statusLine = el('div', 'run-status');
  if (hMeta && hMeta.running) {
    statusLine.appendChild(el('span', 'pill amber', 'Running'));
    const mode = hMeta.lastOptions && hMeta.lastOptions.mode
      ? String(hMeta.lastOptions.mode).toUpperCase() : 'FULL';
    let line = mode + ' mode';
    const startMs = (typeof hMeta.runStartedAt === 'number') ? hMeta.runStartedAt
      : (hMeta.runStartedAt ? Date.parse(hMeta.runStartedAt) : null);
    if (startMs && !isNaN(startMs)) line += ' · started ' + relTime(startMs);
    statusLine.appendChild(document.createTextNode(line));
  } else {
    statusLine.appendChild(el('span', 'pill grey', 'Idle'));
    const lastMs = headlessLastRunMs(hMeta);
    statusLine.appendChild(document.createTextNode(lastMs ? 'last run ' + relTime(lastMs) : 'no runs yet'));
  }
  stPanel.appendChild(statusLine);

  // v1.7.2 (§20.6): quiet browser-sync freshness line under the headless
  // status — distinguishes the extension-driven sync from headless runs.
  const lastBrowserSyncMs = state.data && typeof state.data.lastSyncAt === 'number'
    ? state.data.lastSyncAt : null;
  stPanel.appendChild(el('div', 'manifest',
    'LAST BROWSER SYNC: ' + (lastBrowserSyncMs ? relTime(lastBrowserSyncMs) : 'never')));

  stPanel.appendChild(el('h2', null, 'History'));
  const hist = hMeta && Array.isArray(hMeta.history) ? hMeta.history.slice(0, 20) : [];
  if (!hist.length) {
    stPanel.appendChild(el('p', 'empty', 'No runs recorded yet.'));
  } else {
    const table = el('table', 'sync-hist');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Time', 'Result', 'Orders', 'Duration']) htr.appendChild(el('th', null, h));
    thead.appendChild(htr);
    table.appendChild(thead);
    const tbody = el('tbody');
    for (const run of hist) {
      const tr = el('tr');
      tr.appendChild(el('td', null, run && run.t ? relTime(run.t) : 'unknown'));
      const ok = run && run.result === 'ok';
      const cancelled = run && run.result === 'cancelled';
      const resTd = el('td', ok ? 'hist-ok' : cancelled ? 'hist-cancelled' : 'hist-error',
        ok ? 'OK' : cancelled ? 'CANCELLED' : 'ERROR');
      if (!ok && !cancelled && run && run.error) resTd.title = String(run.error);
      tr.appendChild(resTd);
      tr.appendChild(el('td', null, String(Number(run && run.ordersSynced) || 0)));
      tr.appendChild(el('td', null, Math.round((Number(run && run.durationMs) || 0) / 1000) + 's'));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    stPanel.appendChild(table);
  }
  root.appendChild(stPanel);

  // --- LIVE LOG panel ---
  const logPanel = el('div', 'panel');
  logPanel.id = 'liveLogPanel';
  logPanel.appendChild(el('h2', null, 'Live log'));
  const bar = el('div', 'logbar');
  const pauseBtn = el('button', 'chip' + (state.logPaused ? ' active' : ''),
    state.logPaused ? 'Resume' : 'Pause');
  pauseBtn.type = 'button';
  pauseBtn.id = 'logPauseBtn';
  pauseBtn.addEventListener('click', () => { state.logPaused = !state.logPaused; renderAll(); });
  bar.appendChild(pauseBtn);
  const clearBtn = el('button', 'chip', 'Clear view');
  clearBtn.type = 'button';
  clearBtn.id = 'logClearBtn';
  clearBtn.addEventListener('click', () => {
    state.logLines = [];
    const b = document.getElementById('logBox');
    if (b) b.textContent = '';
  });
  bar.appendChild(clearBtn);

  // v1.8.8 (§26.3): COPY — copies the currently visible log text to the
  // clipboard; transient COPIED label state (chips render uppercase).
  const copyLogBtn = el('button', 'chip', 'Copy');
  copyLogBtn.type = 'button';
  copyLogBtn.id = 'logCopyBtn';
  copyLogBtn.addEventListener('click', async () => {
    const b = document.getElementById('logBox');
    const parts = [];
    if (b) {
      for (const n of b.querySelectorAll('.logline')) {
        if (n.classList.contains('logplaceholder')) continue; // not log text
        const lt = n.querySelector('.lt');
        const body = lt ? n.textContent.slice(lt.textContent.length) : n.textContent;
        parts.push((lt ? lt.textContent + ' ' : '') + body);
      }
    }
    try {
      await navigator.clipboard.writeText(parts.join('\n'));
      copyLogBtn.textContent = 'Copied';
    } catch (e) {
      copyLogBtn.textContent = 'Copy failed';
    }
    setTimeout(() => { copyLogBtn.textContent = 'Copy'; }, 1500);
  });
  bar.appendChild(copyLogBtn);

  // v1.8.8 (§26.3): CLEAR — empties the SERVER ring buffer via
  // POST /api/logs/clear and clears the local view. The polling cursor is
  // left untouched (monotonic), so the poller never refetches old lines —
  // only lines logged after the clear stream in.
  const clearServerBtn = el('button', 'chip', 'Clear');
  clearServerBtn.type = 'button';
  clearServerBtn.id = 'logClearServerBtn';
  clearServerBtn.title = 'Clear the server log buffer and this view';
  clearServerBtn.addEventListener('click', async () => {
    clearServerBtn.disabled = true;
    try {
      const res = await fetch('/api/logs/clear', { method: 'POST' });
      if (!res.ok) {
        showNotice('Could not clear the log (HTTP ' + res.status + ')');
      } else {
        state.logLines = [];
        const b = document.getElementById('logBox');
        if (b) b.textContent = '';
      }
    } catch (e) {
      showNotice('Could not clear the log (' + e.message + ')');
    } finally {
      clearServerBtn.disabled = false;
    }
  });
  bar.appendChild(clearServerBtn);
  bar.appendChild(el('span', 'spacer'));
  bar.appendChild(el('span', 'manifest', 'Polls only while this tab is visible'));
  logPanel.appendChild(bar);

  const box = el('div', 'logbox');
  box.id = 'logBox';
  if (state.logLines.length) {
    for (const l of state.logLines) box.appendChild(renderLogLine(l));
  } else {
    box.appendChild(el('div', 'logline logplaceholder', 'Waiting for log lines…'));
  }
  box.addEventListener('scroll', () => {
    state.logPinned = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  });
  logPanel.appendChild(box);
  root.appendChild(logPanel);
  requestAnimationFrame(() => { if (state.logPinned) box.scrollTop = box.scrollHeight; });

  // --- GEMINI USAGE panel (hidden without an API key) ---
  const gem = state.data && state.data.gemini;
  if (state.data && state.data.geminiConfigured !== false &&
      gem && Number.isInteger(gem.used) && Number.isInteger(gem.limit) && gem.limit > 0) {
    const p = el('div', 'panel');
    p.id = 'geminiPanel';
    p.appendChild(el('h2', null, 'Gemini usage'));
    const gemNum = el('div', 'gem-num', gem.used + ' / ' + gem.limit);
    gemNum.id = 'gemNum';
    p.appendChild(gemNum);
    const track = el('div', 'gem-track');
    const fill = el('div', 'gem-fill');
    fill.id = 'gemFill';
    const pct = Math.min(100, Math.max(0, (gem.used / gem.limit) * 100));
    if (pct >= 80) fill.classList.add('warn');
    fill.style.width = pct.toFixed(1) + '%';
    track.appendChild(fill);
    p.appendChild(track);
    p.appendChild(el('div', 'gem-sub', 'Resets at midnight'));
    root.appendChild(p);
  }

  startLogPolling();
}

// Tabs, search, theme toggle, boot
// ---------------------------------------------------------------------------

// v1.4.0: sync freshness — dismissible amber banner (all tabs) when stale,
// quiet topbar label when fresh. Dismissal is per-session (memory only).
function renderSyncFreshness() {
  const label = document.getElementById('syncLabel');
  const banner = document.getElementById('syncBanner');
  const d = state.data || {};
  const hasData = (d.orders || []).length > 0;
  const last = typeof d.lastSyncAt === 'number' ? d.lastSyncAt : null;
  const remindDays = Number(d.syncReminderDays) || 7;
  const days = last == null ? null : Math.floor((Date.now() - last) / 86400000);
  const stale = last == null ? hasData : days > remindDays;

  if (stale && !state.bannerDismissed) {
    banner.textContent = '';
    const msg = last == null
      ? 'LAST SYNC NEVER — OPEN YOUR AMAZON ORDERS PAGE AND RUN SYNC TO REFRESH'
      : 'LAST SYNC ' + days + (days === 1 ? ' DAY' : ' DAYS') +
        ' AGO — OPEN YOUR AMAZON ORDERS PAGE AND RUN SYNC TO REFRESH';
    banner.appendChild(el('span', null, msg));
    const dismiss = el('button', 'linkbtn dismiss', 'Dismiss');
    dismiss.type = 'button';
    dismiss.addEventListener('click', () => {
      state.bannerDismissed = true;
      banner.hidden = true;
    });
    banner.appendChild(dismiss);
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }

  if (!stale && last != null) {
    label.textContent = days <= 0 ? 'SYNCED TODAY' : 'SYNCED ' + days + 'd AGO';
    label.hidden = false;
  } else {
    label.hidden = true;
  }
}

function renderAll() {
  if (!state.data) return;
  // v1.8.7 (§25.2): every full render (tab/search/data change) resets
  // the Needs Review batch window; LOAD MORE bypasses renderAll entirely.
  state.reviewLimit = REVIEW_BATCH;
  document.getElementById('ver').textContent = 'v' + (state.data.version || "2.1.0");
  renderSyncFreshness();

  // v1.8.0 (§21.1): flagged reviewMissing items count toward the tab badge —
  // they are listed on the Needs Review tab too. v1.8.8 (§26.2): beyond-cutoff
  // items are excluded — the badge counts only within-cutoff items (posted
  // items are never beyondCutoff, so reviewMissing is unaffected).
  const pending = state.data.orders.reduce(
    (s, o) => s + o.items.filter(i => (!i.posted && !i.beyondCutoff) || i.reviewMissing).length, 0);
  const count = document.getElementById('reviewCount');
  count.textContent = String(pending);
  count.hidden = pending === 0;

  const panels = {
    overview: document.getElementById('panel-overview'),
    orders: document.getElementById('panel-orders'),
    sync: document.getElementById('panel-sync'),
    review: document.getElementById('panel-review')
  };
  for (const [name, panel] of Object.entries(panels)) {
    panel.hidden = name !== state.tab;
    panel.textContent = '';
  }
  if (state.tab === 'overview') renderOverview(panels.overview);
  else if (state.tab === 'orders') renderOrders(panels.orders);
  else if (state.tab === 'sync') renderSync(panels.sync);
  else renderReview(panels.review);

  for (const btn of document.querySelectorAll('#tabs .tab')) {
    btn.classList.toggle('active', btn.dataset.tab === state.tab);
  }

  // v1.7.0: the log poller only lives on the SYNC tab.
  if (state.tab !== 'sync') stopLogPolling();
}

// v1.7.0: #/tab hash routing (boot + tab clicks); keeps deep links working.
const KNOWN_TABS = ['overview', 'orders', 'sync', 'review'];
function tabFromHash() {
  const m = String(location.hash || '').match(/^#\/(\w+)/);
  return (m && KNOWN_TABS.includes(m[1])) ? m[1] : null;
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  try { history.replaceState(null, '', '#/' + state.tab); } catch { /* file:// etc. */ }
  renderAll();
});

window.addEventListener('hashchange', () => {
  const t = tabFromHash();
  if (t && t !== state.tab) {
    state.tab = t;
    renderAll();
  }
});

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  state.query = searchInput.value;
  if (state.tab !== 'orders') {
    state.tab = 'orders';
    try { history.replaceState(null, '', '#/orders'); } catch { /* file:// etc. */ }
  }
  renderAll();
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput &&
      !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    state.query = '';
    renderAll();
    searchInput.blur();
  }
});

// Theme toggle: cycles dark -> light -> auto, persisted in localStorage.
// 'auto' removes data-theme so CSS falls back to prefers-color-scheme
// (dark by default, light when the OS asks for it).
const themeBtn = document.getElementById('themeToggle');
const THEME_KEY = 'aos-theme';
let themeMode = 'auto';
try { themeMode = localStorage.getItem(THEME_KEY) || 'auto'; } catch { /* storage blocked */ }
if (themeMode !== 'dark' && themeMode !== 'light' && themeMode !== 'auto') themeMode = 'auto';

function applyTheme(mode) {
  if (mode === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', mode);
  }
  themeBtn.textContent = 'THEME: ' + mode.toUpperCase();
}

themeBtn.addEventListener('click', () => {
  themeMode = themeMode === 'dark' ? 'light' : themeMode === 'light' ? 'auto' : 'dark';
  try { localStorage.setItem(THEME_KEY, themeMode); } catch { /* storage blocked */ }
  applyTheme(themeMode);
});
applyTheme(themeMode);

// v1.7.0: honor a #/tab deep link on first load.
const bootTab = tabFromHash();
if (bootTab) state.tab = bootTab;

load();
</script>
</body>
</html>
