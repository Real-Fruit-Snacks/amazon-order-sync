name        = "amazon-order-sync"
description = "Syncs your Amazon orders into local Markdown notes"

[panel]
kind   = "flow"
status = ["ok one Order-<id>.md per order"]

[panel.input]
label = "Order History"
note  = "Amazon"
chips = ["orders", "items", "totals"]
tone  = "steel-ink"

[panel.tool]
label = "amazon-order-sync"
note  = "Rust"

[panel.output]
label = "Markdown Notes"
note  = "local vault"
chips = ["Order-<id>.md"]
tone  = "mint"
