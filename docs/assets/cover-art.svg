<!-- amazon-order-sync cover panel (layout v2): the dashboard. 528x448, origin = panel top-left.
     Rendered by Real-Fruit-Snacks/rfs-brand tools/make-cover.py; colours are {tokens}.
     Drawn for a 400px card: the order count, lifetime spend and the monthly chart, with
     only this month in Ember. Figures are the v1 cover's examples. -->
<rect width="528" height="448" fill="{bg}"/>
<!-- top bar: the app, served on 127.0.0.1 -->
<rect width="528" height="56" fill="{surface}"/><rect y="56" width="528" height="1" fill="{line}"/>
<rfs-text font="mono-semibold" size="20" x="24" y="35" fill="{text}">Amazon Order Sync</rfs-text>
<rect x="374.5" y="14.5" width="129" height="27" rx="5" fill="{raised}" stroke="{line}"/>
<rfs-text font="mono" size="16" x="439" y="33" anchor="middle" fill="{mute}">127.0.0.1</rfs-text>
<!-- stat cards -->
<rect x="24.75" y="76.75" width="230.5" height="98.5" rx="8" fill="{surface}" stroke="{line}" stroke-width="1.5"/>
<rfs-text font="mono-semibold" size="46" x="44" y="134" fill="{text}">412</rfs-text>
<rfs-text font="mono" size="15" x="44" y="159" ls="1.2" fill="{mute}">TOTAL ORDERS</rfs-text>
<rect x="272.75" y="76.75" width="230.5" height="98.5" rx="8" fill="{surface}" stroke="{line}" stroke-width="1.5"/>
<rfs-text font="mono-semibold" size="46" x="292" y="134" fill="{text}">$8,214</rfs-text>
<rfs-text font="mono" size="15" x="292" y="159" ls="1.2" fill="{mute}">LIFETIME SPEND</rfs-text>
<!-- monthly spend: twelve months, this one in Ember -->
<rect x="24.75" y="192.75" width="478.5" height="230.5" rx="8" fill="{surface}" stroke="{line}" stroke-width="1.5"/>
<rfs-text font="mono" size="15" x="44" y="222" ls="1.2" fill="{mute}">MONTHLY SPEND</rfs-text>
<rect x="44" y="384" width="440" height="1.5" fill="{line}"/>
<rect x="50" y="321" width="25" height="63" rx="3" fill="{line-strong}"/>
<rect x="87" y="294" width="25" height="90" rx="3" fill="{line-strong}"/>
<rect x="124" y="333" width="25" height="51" rx="3" fill="{line-strong}"/>
<rect x="161" y="264" width="25" height="120" rx="3" fill="{line-strong}"/>
