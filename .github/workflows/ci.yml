name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Toolchain and package versions live in tools/versions.json (and tools/requirements-art.txt);
# the release workflow and the dev kit read the same files.
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "pinned" is the Node.js in tools/versions.json, the one the Windows zip carries;
          # 18 is the oldest the server supports.
          - { os: ubuntu-latest, node: "18" }
          - { os: ubuntu-latest, node: pinned }
          - { os: windows-latest, node: pinned }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Pinned versions
        id: pins
        shell: bash
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json | tr -d '\r' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node == 'pinned' && steps.pins.outputs.node || matrix.node }}
      - name: Syntax
        run: |
          node --check server/server.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
      - name: Tests
        # --test-force-exit: on Windows a spawned server can outlive the run
        # (Node 20+). The headless-run tests skip themselves on Windows.
        run: node --test ${{ matrix.node != '18' && '--test-force-exit' || '' }} tests/server.test.js
  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pinned versions
        id: pins
        shell: bash
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json | tr -d '\r' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.pins.outputs.dotnetSdk }}
      - name: Use that SDK
        # The runner has newer SDKs too, and dotnet picks the newest unless global.json says otherwise.
        shell: bash
        run: |
          echo '{ "sdk": { "version": "${{ steps.pins.outputs.dotnetSdk }}", "rollForward": "disable" } }' > global.json
          dotnet --version
      - name: Build
        run: dotnet build tray -c Release -warnaserror
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse on Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in 'install.ps1', 'import-old-notes.ps1', 'tools/build-dev-kit.ps1', 'tools/dev-kit/setup.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host "${f}: $($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The PowerShell Gallery is flaky from hosted runners: a download fails, or PSGallery
          # isn't registered at all because the gallery was unreachable when PowerShellGet first
          # loaded. Use the module if the runner image already has that version; otherwise
          # re-register the gallery if needed and install, 5 tries, 15/30/45/60 s apart.
          $pins = Get-Content tools/versions.json -Raw | ConvertFrom-Json
          $modules = @(
            @{ Name = 'PSScriptAnalyzer'; Version = $pins.PSScriptAnalyzer }
          )
          foreach ($m in $modules) {
            if (Get-Module -ListAvailable $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "$($m.Name) $($m.Version) is already on the runner"; continue
            }
            for ($try = 1; $true; $try++) {
              try {
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Write-Host 'PSGallery is not registered; registering it'
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module $m.Name -RequiredVersion $m.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 5) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (15 * $try)
              }
            }
          }
          $r = foreach ($f in 'install.ps1', 'import-old-notes.ps1', 'tools/build-dev-kit.ps1', 'tools/dev-kit/setup.ps1') { Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning }
          $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($r) { exit 1 }
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        # The version in tools/versions.json, from its GitHub release, not whatever the image has.
        run: |
          v=$(jq -r .shellcheck tools/versions.json)
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.x86_64.tar.xz" | tar -xJ
          "./shellcheck-v$v/shellcheck" --version
          "./shellcheck-v$v/shellcheck" install.sh
  art:
    # The README picture and the samples on the project page are generated. make-samples.mjs syncs
    # the made-up orders in tools/samples.json through the real server; make-slip.py draws the
    # picture from the notes it wrote. Fail if the committed files no longer match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pinned versions
        id: pins
        shell: bash
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json | tr -d '\r' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Regenerate the samples and the README picture
        run: |
          python -m pip install --quiet -r tools/requirements-art.txt
          node tools/make-samples.mjs
          python tools/make-slip.py
          git status --short -- docs/samples docs/assets/slip-dark.svg docs/assets/slip-light.svg docs/index.html README.md
          git diff --exit-code -- docs/samples docs/assets/slip-dark.svg docs/assets/slip-light.svg docs/index.html README.md
          test -z "$(git status --porcelain -- docs/samples)"
