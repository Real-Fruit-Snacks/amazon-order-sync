name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Validate manifest against versions.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "if (!require('./versions.json')['$version']) { console.error('manifest version $version missing from versions.json'); process.exit(1); }"

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Syntax-check extension scripts
        run: |
          node --check content.js
          node --check popup.js
