name: links

# Links in the README, the guides and the project page. Monthly too, because the pages they point
# at move without this repo changing. Amazon's own pages are skipped: they answer link checkers
# with errors, and the sample notes link to made-up products.
on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/**.html']
  schedule:
    - cron: '41 6 4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429 --exclude-all-private
            --exclude '^https?://([a-z]+\.)?amazon\.'
            --exclude '^https?://evil\.com'
            --exclude '^https://github\.com/Real-Fruit-Snacks/amazon-order-sync/(issues/new|security/advisories/new)'
            --exclude-path '^docs/samples'
            --remap '^https://github\.com/Real-Fruit-Snacks/amazon-order-sync/blob/main/([^#]+)(#.*)?$ file://${{ github.workspace }}/$1'
            './**/*.md' 'docs/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
