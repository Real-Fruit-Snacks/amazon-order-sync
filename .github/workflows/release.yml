# Push a tag vX.Y.Z (matching Cargo.toml and the top of CHANGELOG.md) to publish a release. Run it
# by hand (workflow_dispatch) to build and check every download without publishing.
# No artifacts between jobs (they count against the account's Actions storage): the Windows job
# builds the Windows zip and the dev kit, checks both with the network cut off and creates a draft
# release; the Linux job builds the tarball, checks it with the network cut off, adds it and
# SHA256SUMS.txt and publishes the release.
# Versions come from tools/versions.json, the file ci.yml and the dev kit read.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  # cargo-about writes THIRD-PARTY-LICENSES.txt. Pinned, with the checksums of its
  # release archives from github.com/EmbarkStudios/cargo-about/releases.
  CARGO_ABOUT_VERSION: 0.9.3
  CARGO_ABOUT_SHA256_LINUX: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
  CARGO_ABOUT_SHA256_WINDOWS: 9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pinned versions
        id: pins
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - run: cargo test --locked
      - run: cargo build --release --locked && cargo build --locked --examples
      - run: node --test --test-force-exit tests/server.test.js
      - name: Parity with the Node.js server (v2.3.0)
        env:
          AOS_SERVER_BIN: target/release/amazon-order-sync
          AOS_FAKE_BROWSER_BIN: target/debug/examples/fake_browser
        run: node --test --test-concurrency=1 --test-force-exit tests/parity.test.js
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        id: pins
        shell: bash
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json | tr -d '\r' >> "$GITHUB_OUTPUT"
          v=$(sed -n 's/^version = "\(.*\)"\r\{0,1\}$/\1/p' Cargo.toml | head -n 1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "^## \[${v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no [${v}] section"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          if grep -qai 'vcruntime140' target/release/amazon-order-sync.exe; then
            echo "::error::The exe imports VCRUNTIME140.dll. The C runtime should be linked in (.cargo/config.toml)."; exit 1
          fi
      - name: Third-party licences
        shell: bash
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc"
          curl -sSfL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256_WINDOWS *about.tar.gz" | sha256sum -c -
          mkdir -p ../about-tool && tar -xzf about.tar.gz -C ../about-tool && rm about.tar.gz
          "../about-tool/$name/cargo-about.exe" generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        shell: pwsh
        run: |
          $d = 'dist/amazon-order-sync'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/amazon-order-sync.exe (Join-Path $d 'AmazonOrderSync.exe')
          Copy-Item -Recurse browser-extension $d
          Copy-Item install.ps1, import-old-notes.ps1, config.example.json, LICENSE, THIRD-PARTY-LICENSES.txt, README.md, CHANGELOG.md $d
          Compress-Archive -Path "$d/*" -DestinationPath amazon-order-sync-windows.zip
          Write-Host ("amazon-order-sync-windows.zip: {0:N1} MB" -f ((Get-Item amazon-order-sync-windows.zip).Length / 1MB))
      - name: Build the dev kit
        shell: pwsh
        run: ./tools/build-dev-kit.ps1 -Version ${{ steps.pins.outputs.version }} -OutDir .
      - name: "Offline check: the Windows zip installs and runs"
        # A fresh folder and the internet and the package registries cut off. install.ps1 runs as
        # the README says, without the startup entry; the tray app it starts must run the server
        # itself (one process), and /api/health must answer with this version.
        shell: powershell
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows PowerShell's web cmdlets use the .NET default proxy, not HTTP_PROXY.
          [System.Net.WebRequest]::DefaultWebProxy = New-Object System.Net.WebProxy('http://127.0.0.1:9', $true)
          $app = Join-Path $env:RUNNER_TEMP 'aos-windows'
          Expand-Archive amazon-order-sync-windows.zip $app
          $exe = Join-Path $app 'AmazonOrderSync.exe'
          $reached = $true
          try { Invoke-WebRequest https://www.amazon.com/ -UseBasicParsing -TimeoutSec 15 | Out-Null } catch { $reached = $false }
          if ($reached) { throw 'The cut-off failed: Windows PowerShell reached the internet.' }
          Write-Host 'The internet is cut off for this step.'
          $logs = Join-Path $env:LOCALAPPDATA 'amazon-order-sync'
          try {
              & (Join-Path $app 'install.ps1') -NotesPath (Join-Path $env:RUNNER_TEMP 'aos-notes') -NoAutostart
              $h = Invoke-RestMethod http://127.0.0.1:27483/api/health -TimeoutSec 10
              if (-not $h.ok -or $h.version -ne '${{ steps.pins.outputs.version }}') { throw "/api/health: $($h | ConvertTo-Json -Compress)" }
              $server = Get-CimInstance Win32_Process -Filter "ProcessId = $($h.pid)"
              if ($server.ExecutablePath -ne $exe) { throw "The server runs in $($server.ExecutablePath), not $exe." }
              $o = Invoke-RestMethod http://127.0.0.1:27483/api/orders -TimeoutSec 10
              if ($o.version -ne '${{ steps.pins.outputs.version }}') { throw "/api/orders: $($o | ConvertTo-Json -Compress -Depth 2)" }
              $dash = Invoke-WebRequest http://127.0.0.1:27483/ -UseBasicParsing -TimeoutSec 10
              if ($dash.Content -notmatch 'Amazon Order Sync') { throw 'The dashboard did not load.' }
              Write-Host "OK: AmazonOrderSync.exe $($h.version) (pid $($h.pid)) is the tray and the server, and answers /api/health, /api/orders and /."
          } catch {
              foreach ($f in 'tray.log', 'server.log') { if (Test-Path "$logs\$f") { Write-Host "--- $f"; Get-Content "$logs\$f" -Tail 40 } }
              throw
          } finally {
              # Leave nothing behind: the tray and its server, the config, the shortcut, the logs.
              & (Join-Path $app 'install.ps1') -Uninstall
              Remove-Item -Recurse -Force (Join-Path $env:APPDATA 'amazon-order-sync'), $logs -ErrorAction SilentlyContinue
              Remove-Item (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Amazon Order Sync.lnk') -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          if (Get-Process AmazonOrderSync -ErrorAction SilentlyContinue) { throw 'The tray app is still running after -Uninstall.' }
      - name: "Offline check: the dev kit sets up, tests and builds"
        # A fresh folder, the internet cut off, every registry dead, fresh caches so the runner's
        # can't help, and no package source but the kit's. Then offline\setup.ps1 (in Windows
        # PowerShell 5.1, then PowerShell 7) and the checks ci.yml runs, from the unzipped kit.
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
          NODE_USE_ENV_PROXY: "1"
          CARGO_HOME: ${{ runner.temp }}\kit-cache\cargo-home
          CARGO_NET_OFFLINE: "true"
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          PIP_NO_INDEX: "1"
          PIP_CACHE_DIR: ${{ runner.temp }}\kit-cache\pip
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $v = '${{ steps.pins.outputs.version }}'
          Expand-Archive "amazon-order-sync-$v-dev-windows-x64.zip" (Join-Path $env:RUNNER_TEMP 'kit')
          $kit = Join-Path $env:RUNNER_TEMP "kit\amazon-order-sync-$v-dev"
          # An empty CARGO_HOME: no registry cache from the runner. rustup's toolchain stays (RUSTUP_HOME).
          New-Item -ItemType Directory -Force $env:CARGO_HOME | Out-Null
          Unregister-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if (Get-Command Unregister-PSResourceRepository -ErrorAction SilentlyContinue) { Unregister-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue }
          $reached = $true
          try { Invoke-WebRequest https://index.crates.io/config.json -TimeoutSec 15 | Out-Null } catch { $reached = $false }
          if ($reached) { throw 'The cut-off failed: PowerShell reached crates.io.' }
          Write-Host 'The internet is cut off for this step.'
          # A baseline, to see what the sample generators change.
          git -C $kit init -q
          git -C $kit -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false add -A
          git -C $kit -c user.name=ci -c user.email=ci@localhost commit -q -m kit
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\offline\setup.ps1"
          & "$kit\offline\setup.ps1"
          if ($LASTEXITCODE) { throw "setup.ps1 failed in PowerShell 7 (exit $LASTEXITCODE)" }
          Set-Location $kit
          $pssa = (Get-Content tools/versions.json -Raw | ConvertFrom-Json).PSScriptAnalyzer
          $m = @(Get-Module PSScriptAnalyzer)
          if ($m.Count -ne 1 -or $m[0].Version -ne [version]$pssa -or -not $m[0].ModuleBase.StartsWith("$kit\offline\powershell\")) { throw "PSScriptAnalyzer: $($m.Version) from $($m.ModuleBase)" }
          Write-Host "PSScriptAnalyzer $($m[0].Version) from $($m[0].ModuleBase)"
          cargo test --offline --locked
          cargo build --release --offline --locked
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
          node --test --test-force-exit tests/server.test.js
          $r = foreach ($f in 'install.ps1', 'import-old-notes.ps1', 'tools/build-dev-kit.ps1', 'tools/dev-kit/setup.ps1') { Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning }
          $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($r) { throw 'PSScriptAnalyzer found problems.' }
          node tools/make-samples.mjs
          .venv\Scripts\python.exe tools/make-slip.py
          git -c core.autocrlf=false -c core.eol=lf diff --exit-code -- docs/samples docs/assets/slip-dark.svg docs/assets/slip-light.svg docs/index.html README.md
          if (git status --porcelain -- docs/samples) { throw 'make-samples.mjs wrote files the kit does not have.' }
          Write-Host 'The dev kit set up, tested, built and linted with no network.'
      - name: "Offline check: the dev kit's scripts parse in Windows PowerShell 5.1"
        shell: powershell
        working-directory: ${{ runner.temp }}\kit\amazon-order-sync-${{ steps.pins.outputs.version }}-dev
        run: |
          $bad = 0
          foreach ($f in 'install.ps1', 'import-old-notes.ps1', 'tools\build-dev-kit.ps1', 'tools\dev-kit\setup.ps1', 'offline\setup.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host "${f}: $($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: SHA-256
        id: sums
        shell: pwsh
        run: |
          $lines = foreach ($f in 'amazon-order-sync-windows.zip', 'amazon-order-sync-${{ steps.pins.outputs.version }}-dev-windows-x64.zip') {
            '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
            Write-Host ('{0}: {1:N1} MB' -f $f, ((Get-Item $f).Length / 1MB))
          }
          $lines | Write-Host
          Add-Content $env:GITHUB_OUTPUT "sums<<SUMS_END"
          Add-Content $env:GITHUB_OUTPUT $lines
          Add-Content $env:GITHUB_OUTPUT "SUMS_END"
      - name: Release notes and draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.pins.outputs.version }}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md \
            amazon-order-sync-windows.zip "amazon-order-sync-$v-dev-windows-x64.zip"
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pinned versions
        id: pins
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' tools/versions.json >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: x86_64-unknown-linux-musl
      - name: Build (static, musl)
        # One file with no shared-library needs, so it runs on any x86-64 Linux.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/amazon-order-sync
          if ldd target/x86_64-unknown-linux-musl/release/amazon-order-sync 2>/dev/null | grep -q '=>'; then
            echo "::error::The Linux program links shared libraries."; exit 1
          fi
      - name: Third-party licences
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256_LINUX *about.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/about" && tar -xzf about.tar.gz -C "$RUNNER_TEMP/about" && rm about.tar.gz
          "$RUNNER_TEMP/about/$name/cargo-about" generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        run: |
          mkdir -p dist/amazon-order-sync
          cp target/x86_64-unknown-linux-musl/release/amazon-order-sync dist/amazon-order-sync/
          cp -r browser-extension install.sh amazon-order-sync.service config.example.json LICENSE THIRD-PARTY-LICENSES.txt README.md CHANGELOG.md dist/amazon-order-sync/
          tar czf amazon-order-sync-linux.tar.gz -C dist amazon-order-sync
          ls -l amazon-order-sync-linux.tar.gz
      - name: "Offline check: the Linux program runs"
        # Unpacked in a fresh folder, then started with no network (a new network namespace with
        # only loopback): it must answer /api/health with this version and serve the dashboard.
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          app="$RUNNER_TEMP/aos-linux"; mkdir -p "$app" && tar xzf amazon-order-sync-linux.tar.gz -C "$app"
          printf '{ "notesPath": "%s", "geminiApiKey": "", "port": 27483 }\n' "$RUNNER_TEMP/aos-notes" > "$RUNNER_TEMP/aos-config.json"
          sudo unshare --net sh -c '
            ip link set lo up
            if curl -s --max-time 5 https://www.amazon.com/ >/dev/null; then echo "the cut-off failed"; exit 1; fi
            AMAZON_SYNC_CONFIG="$1" "$2/amazon-order-sync/amazon-order-sync" serve > "$3/serve.log" 2>&1 &
            for i in $(seq 1 50); do curl -sf http://127.0.0.1:27483/api/health > "$3/health.json" && break; sleep 0.2; done
            curl -sf http://127.0.0.1:27483/ | grep -q "Amazon Order Sync"
            kill %1
          ' sh "$RUNNER_TEMP/aos-config.json" "$app" "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/health.json"; echo
          test "$(jq -r .version "$RUNNER_TEMP/health.json")" = "$v"
          test "$(jq -r .platform "$RUNNER_TEMP/health.json")" = "linux"
      - name: SHA256SUMS.txt
        env:
          WINDOWS_SUMS: ${{ needs.windows.outputs.sums }}
        run: |
          { printf '%s\n' "$WINDOWS_SUMS" | tr -d '\r'; sha256sum amazon-order-sync-linux.tar.gz; } | sort -k 2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
      - name: Upload and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" amazon-order-sync-linux.tar.gz SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
