[package]
name = "amazon-order-sync"
version = "3.0.0"
authors = ["Real-Fruit-Snacks"]
description = "Syncs your Amazon orders into local Markdown notes"
license = "MIT"
repository = "https://github.com/Real-Fruit-Snacks/amazon-order-sync"
edition = "2021"
# The browser extension, the dashboard and the fonts stay where they are; the
# binary embeds server/dashboard.html, server/fonts and server/icons.
include = ["src/**", "build.rs", "server/dashboard.html", "server/fonts/**", "server/icons/**", "tray/app.ico", "LICENSE", "README.md"]

# Its own workspace: cargo never looks for one in a folder above.
[workspace]

[[bin]]
name = "amazon-order-sync"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
percent-encoding = "2"
getrandom = "0.3"
indexmap = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rustls (with ring) everywhere but Windows, where the system TLS stack
# (SChannel) is used instead: it trusts the Windows certificate store and
# needs no C compiler to build.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(windows)'.dependencies.ureq]
version = "2.12"
default-features = false
features = ["native-tls", "gzip"]

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
