<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Amazon Sync <span style="font-size: 10px; color: #888; font-weight: normal;">v1.0.4</span></h1>
                <div class="status-badge" id="statusBadge">Idle</div>
            </div>
            <p class="subtitle">Export orders to Obsidian</p>
        </header>

        <div class="action-buttons">
            <button id="syncBtn" class="btn primary">Sync Current Page</button>
            <button id="autoSyncBtn" class="btn secondary">Auto-Sync All Pages</button>
            <button id="stopSyncBtn" class="btn danger hidden">Stop Sync</button>
        </div>

        <div class="log-container">
            <div class="log-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Activity Log</span>
                <button id="copyLogBtn" class="btn secondary" style="padding: 2px 8px; font-size: 11px; margin: 0;">Copy Log</button>
            </div>
            <div id="logOutput" class="log-output">
                <!-- Logs injected here -->
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
